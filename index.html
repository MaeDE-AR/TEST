<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildesporing AR</title>
    <!-- Fullstendige og fungerende lenker til AR-motoren -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        .a-enter-vr { display: none; }
    </style>
</head>
<body>
    <!-- Starter scenen og leter etter targets.mind-filen din -->
    <a-scene mindar-image="imageTargetSrc: targets.mind; uiLoading: yes; uiScanning: yes;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="avatarModel" src="cube.glb"></a-asset-item>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <!-- Plasserer modellen din oppå det første bildet den kjenner igjen -->    
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.05 0.05 0.05" src="#avatarModel"></a-gltf-model>
    </a-scene>
</body>
</html>
